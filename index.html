<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beautiful Card Design</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'Poppins', sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .card{
      width:320px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(15px);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:25px;
      padding:30px;
      text-align:center;
      color:white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      transition:0.4s ease;
    }

    .card:hover{
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .profile-img{
      width:110px;
      height:110px;
      border-radius:50%;
      border:4px solid rgba(255,255,255,0.4);
      object-fit:cover;
      margin-bottom:20px;
    }

    h2{
      font-size:28px;
      margin-bottom:8px;
    }

    .role{
      font-size:14px;
      color:#e0e0e0;
      margin-bottom:18px;
      letter-spacing:1px;
    }

    .desc{
      font-size:15px;
      line-height:1.6;
      color:#f5f5f5;
      margin-bottom:25px;
    }

    .btn{
      display:inline-block;
      padding:12px 28px;
      border-radius:50px;
      background:white;
      color:#6a11cb;
      text-decoration:none;
      font-weight:600;
      transition:0.3s;
    }

    .btn:hover{
      background:#f1f1f1;
      transform:scale(1.05);
    }
  </style>
</head>
<body>

  <div class="card">
    <img 
      class="profile-img"
      src="https://i.pravatar.cc/300" 
      alt="Profile"
    >

    <h2>John Doe</h2>
    <p class="role">UI / UX Designer</p>

    <p class="desc">
      Creating beautiful and modern user experiences with clean and elegant designs.
    </p>

    <a href="#" class="btn">Follow</a>
  </div>

</body>
</html>
